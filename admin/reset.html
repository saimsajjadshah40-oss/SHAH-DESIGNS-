<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Set new password — SHAH DESIGNS</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css">
<script type="module" src="/assets/js/admin-auth.js"></script>
</head>
<body data-view="reset">
<div class="auth">
  <aside class="auth-art">
    <div class="brand"><span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M17 7.6C16.2 6 14.4 5 12 5 9 5 7 6.5 7 8.7c0 4.8 10.2 2.6 10.2 7.6 0 2.3-2.2 3.7-5.2 3.7-2.6 0-4.6-1-5.4-2.8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span><span>SHAH<small>DESIGNS</small></span></div>
    <div><h1>Manage your <span>creative studio</span>.</h1><p>Update slides, projects, services, appearance and messages — no code needed.</p></div>
    <small style="opacity:.5">Admin portal · Protected by Appwrite authentication</small>
    <span class="ring"></span><span class="orb"></span>
  </aside>
  <main class="auth-form">
    <div class="auth-card">
      <form id="reset-form" novalidate>
        <h2>Choose a new password</h2>
        <p class="sub">Use at least 12 characters. A password manager is recommended.</p>
        <div class="stack">
          <div class="fld"><label for="np">New password</label><input id="np" name="password" type="password" autocomplete="new-password" minlength="12" required></div>
          <div class="fld"><label for="np2">Confirm password</label><input id="np2" name="confirm" type="password" autocomplete="new-password" minlength="12" required></div>
          <div id="reset-msg"></div>
          <button class="btn btn-primary" style="height:48px" type="submit">Update password</button>
          <a class="btn btn-ghost" href="/admin/login">Back to sign in</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
